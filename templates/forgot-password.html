<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Consent Management System | Forgot Password</title>


    <!-- =====================================================
         FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        /* =====================================================
           ROOT VARIABLES
        ====================================================== */

        :root {

            --primary: #2563eb;

            --primary-dark: #1d4ed8;

            --navy: #0f172a;

            --text: #0f172a;

            --text-secondary: #64748b;

            --muted: #94a3b8;

            --border: #dbe3ef;

            --background: #f5f7fb;

            --input-background: #f8fafc;

            --white: #ffffff;

        }



        /* =====================================================
           RESET
        ====================================================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            font-size: 100%;

        }


        body {

            min-height: 100vh;

            font-family: "Inter", sans-serif;

            background: var(--background);

            color: var(--text);

        }


        button,
        input {

            font-family: inherit;

        }


        button {

            cursor: pointer;

        }


        a {

            text-decoration: none;

        }



        /* =====================================================
           PAGE
        ====================================================== */

        .forgot-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 2rem;

        }



        /* =====================================================
           MAIN CARD
        ====================================================== */

        .forgot-card {

            width: 100%;

            max-width: 41.25rem;

            background: var(--white);

            border:
                0.0625rem solid
                #e5eaf1;

            border-radius: 1.25rem;

            padding:
                2.75rem
                3rem;

            box-shadow:
                0 1.5rem 4rem
                rgba(15, 23, 42, 0.10);

        }



        /* =====================================================
           LOGO
        ====================================================== */

        .brand-logo {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 0.625rem;

            margin-bottom: 2.25rem;

            color: var(--navy);

            font-size: 1rem;

            font-weight: 800;

        }


        .brand-icon {

            width: 2.75rem;

            height: 2.75rem;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 0.75rem;

            background: #eff6ff;

            color: var(--primary);

            font-size: 1.125rem;

        }



        /* =====================================================
           BACK TO LOGIN
        ====================================================== */

        .back-link {

            display: inline-flex;

            align-items: center;

            gap: 0.5rem;

            color: var(--text-secondary);

            font-size: 0.75rem;

            font-weight: 600;

            margin-bottom: 1.75rem;

            transition:
                color 0.2s ease;

        }


        .back-link:hover {

            color: var(--primary);

        }



        /* =====================================================
           RECOVERY ICON
        ====================================================== */

        .recovery-icon {

            width: 4rem;

            height: 4rem;

            display: flex;

            align-items: center;

            justify-content: center;

            margin:
                0 auto
                1.5rem;

            border-radius: 1rem;

            background: #eff6ff;

            color: var(--primary);

            font-size: 1.375rem;

        }



        /* =====================================================
           HEADING
        ====================================================== */

        .heading-section {

            text-align: center;

            margin-bottom: 2rem;

        }


        .form-badge {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                0.4375rem
                0.75rem;

            margin-bottom: 1rem;

            border-radius: 2rem;

            background: #eff6ff;

            color: var(--primary);

            font-size: 0.625rem;

            font-weight: 800;

            letter-spacing: 0.05rem;

        }


        .heading-section h1 {

            font-size: 1.875rem;

            line-height: 1.2;

            font-weight: 800;

            margin-bottom: 0.75rem;

        }


        .heading-section p {

            color: var(--text-secondary);

            font-size: 0.8125rem;

            line-height: 1.7;

        }



        /* =====================================================
           FORM
        ====================================================== */

        .forgot-form {

            width: 100%;

            display: flex;

            flex-direction: column;

        }


        .form-group {

            display: flex;

            flex-direction: column;

            gap: 0.5rem;

            margin-bottom: 1.25rem;

        }


        .form-group label {

            color: #334155;

            font-size: 0.75rem;

            font-weight: 600;

        }



        /* =====================================================
           INPUT
        ====================================================== */

        .input-wrapper {

            position: relative;

            width: 100%;

        }


        .input-icon {

            position: absolute;

            left: 1rem;

            top: 50%;

            transform: translateY(-50%);

            color: var(--muted);

            font-size: 0.8125rem;

            pointer-events: none;

        }


        .input-wrapper input {

            width: 100%;

            height: 3.25rem;

            border:
                0.0625rem solid
                var(--border);

            border-radius: 0.75rem;

            background: var(--input-background);

            color: var(--text);

            padding:
                0
                1rem
                0
                3rem;

            outline: none;

            font-size: 0.8125rem;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

        }


        .input-wrapper input::placeholder {

            color: var(--muted);

        }


        .input-wrapper input:focus {

            border-color: var(--primary);

            background: var(--white);

            box-shadow:
                0 0 0 0.1875rem
                rgba(37, 99, 235, 0.10);

        }



        /* =====================================================
           RESET BUTTON
        ====================================================== */

        .reset-button {

            width: 100%;

            height: 3.25rem;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 0.625rem;

            border: none;

            border-radius: 0.75rem;

            background: var(--primary);

            color: var(--white);

            font-size: 0.8125rem;

            font-weight: 700;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .reset-button:hover {

            background: var(--primary-dark);

            transform: translateY(-0.0625rem);

            box-shadow:
                0 0.5rem 1.25rem
                rgba(37, 99, 235, 0.20);

        }


        .reset-button:active {

            transform: translateY(0);

        }



        /* =====================================================
           LOGIN LINK
        ====================================================== */

        .login-text {

            text-align: center;

            margin-top: 1.75rem;

            color: var(--text-secondary);

            font-size: 0.75rem;

        }


        .login-text a {

            color: var(--primary);

            font-weight: 700;

            margin-left: 0.25rem;

        }


        .login-text a:hover {

            text-decoration: underline;

        }



        /* =====================================================
           FOOTER
        ====================================================== */

        .form-footer {

            display: flex;

            align-items: center;

            justify-content: center;

            flex-wrap: wrap;

            gap: 0.5rem;

            margin-top: 2rem;

            padding-top: 1.5rem;

            border-top:
                0.0625rem solid
                #edf0f4;

            color: var(--muted);

            font-size: 0.625rem;

        }


        .form-footer a {

            color: var(--text-secondary);

        }


        .form-footer a:hover {

            color: var(--primary);

        }


        .footer-dot {

            color: #cbd5e1;

        }



        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 48rem) {

            .forgot-page {

                padding: 1.5rem;

            }


            .forgot-card {

                max-width: 31.25rem;

                padding:
                    2.5rem
                    2.25rem;

            }

        }



        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 30rem) {

            .forgot-page {

                min-height: 100vh;

                padding: 1rem;

                align-items: center;

            }


            .forgot-card {

                padding:
                    2rem
                    1.5rem;

                border-radius: 1rem;

            }


            .brand-logo {

                margin-bottom: 2rem;

            }


            .brand-icon {

                width: 2.5rem;

                height: 2.5rem;

            }


            .recovery-icon {

                width: 3.5rem;

                height: 3.5rem;

                margin-bottom: 1.25rem;

            }


            .heading-section h1 {

                font-size: 1.5rem;

            }


            .heading-section p {

                font-size: 0.75rem;

            }


            .input-wrapper input {

                height: 3rem;

            }


            .reset-button {

                height: 3rem;

            }


            .recovery-info {

                padding:
                    0.75rem
                    0.875rem;

            }

        }



        /* =====================================================
           VERY SMALL DEVICES
        ====================================================== */

        @media (max-width: 22.5rem) {

            .forgot-page {

                padding: 0.75rem;

            }


            .forgot-card {

                padding:
                    1.5rem
                    1rem;

            }


            .heading-section h1 {

                font-size: 1.375rem;

            }


            .form-footer {

                flex-direction: column;

                gap: 0.375rem;

            }


            .footer-dot {

                display: none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         FORGOT PASSWORD PAGE
    ====================================================== -->

    <main class="forgot-page">


        <section class="forgot-card">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <a
                href="login.html"
                class="brand-logo"
            >

                <div class="brand-icon">

                    <i class="fa-solid fa-shield-halved"></i>

                </div>


                <span>
                    Consent Management
                </span>

            </a>



            <!-- =================================================
                 BACK TO LOGIN
            ================================================== -->

            <a
                href="login.html"
                class="back-link"
            >

                <i class="fa-solid fa-arrow-left"></i>

                <span>
                    Back to Login
                </span>

            </a>



            <!-- =================================================
                 RECOVERY ICON
            ================================================== -->

            <div class="recovery-icon">

                <i class="fa-solid fa-key"></i>

            </div>



            <!-- =================================================
                 HEADING
            ================================================== -->

            <div class="heading-section">


                <span class="form-badge">
                    PASSWORD RECOVERY
                </span>


                <h1>
                    Forgot your password?
                </h1>


                <p>
                    Enter the email address associated with
                    your organisation account and we'll send
                    you instructions to reset your password.
                </p>


            </div>



            <!-- =================================================
                 FORM
            ================================================== -->

            <form
                action="/auth/forgot-password"
                method="POST"
                class="forgot-form"
            >


                <!-- EMAIL -->

                <div class="form-group">


                    <label for="email">
                        Registered Email Address
                    </label>


                    <div class="input-wrapper">


                        <i
                            class="fa-regular fa-envelope input-icon"
                        ></i>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="admin@company.com"
                            autocomplete="email"
                            required
                        >


                    </div>


                </div>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="reset-button"
                >

                    <span>
                        Send Reset Link
                    </span>


                    <i class="fa-solid fa-arrow-right"></i>

                </button>


            </form>



            <!-- =================================================
                 SECURITY MESSAGE
            ================================================== -->



            <!-- =================================================
                 LOGIN
            ================================================== -->

            <p class="login-text">

                Remember your password?

                <a href="login.html">
                    Sign in
                </a>

            </p>



            <!-- =================================================
                 FOOTER
            ================================================== -->

            <div class="form-footer">


                <span>
                    Consent Management System
                </span>


                <span class="footer-dot">
                    •
                </span>


                <a href="#">
                    Private
                </a>


                <span class="footer-dot">
                    •
                </span>


                <a href="#">
                    Reliable
                </a>


            </div>


        </section>


    </main>

</body>

</html>
